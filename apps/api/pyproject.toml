[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xagent"
version = "0.1.0"
description = "X-Agent — 面向企业的自主智能体框架（开源重构版）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "X-Agent Contributors" }]

dependencies = [
    # ---- Web 框架 ----
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.9",
    # ---- 数据 ----
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",          # Postgres (full, async)
    "psycopg[binary]>=3.2",   # Postgres (full, sync — Alembic 迁移用)
    "aiosqlite>=0.20",        # SQLite (lite)
    "redis>=5.0",
    "celery>=5.3",             # 后台任务 worker（full 模式）
    # ---- LLM 网关（开源底座）----
    "litellm>=1.50",
    # ---- 可观测 ----
    "langfuse>=2.50,<3",      # pin v2：与单机 Langfuse v2 服务端匹配(v3 需 ClickHouse)
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "prometheus-client>=0.21",
    # ---- 记忆 / 向量 ----
    "qdrant-client>=1.11",
    # ---- 鉴权 ----
    "pyjwt[crypto]>=2.9",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0.1,<4.1",    # pin: bcrypt 4.1+ 与 passlib detect_wrap_bug 不兼容
    # ---- 工具 ----
    "httpx>=0.27",
    "structlog>=24.4",
    "tenacity>=9.0",
]

[project.optional-dependencies]
# 重型 / 可选底座，按需安装，避免 lite 模式臃肿
memory = ["mem0ai>=0.1.40", "graphiti-core>=0.3"]
editor = ["moviepy>=2.0", "pyJianYingDraft>=0.1"]
orchestration = ["langgraph>=0.2.40", "temporalio>=1.7"]
browser = ["browser-use>=0.1.40", "playwright>=1.48"]
authz = ["casbin>=1.36"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
]

[project.scripts]
xagent = "xagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["xagent"]

# ---------------- 工具配置 ----------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["xagent", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C4"]
ignore = [
    "S101",      # allow assert in tests
    "B008",      # FastAPI 惯用法：Depends() 写在参数默认值
    "ASYNC109",  # 适配器接口故意暴露 timeout 形参
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "ASYNC221", "ASYNC240"]
"xagent/adapters/audio/base.py" = ["ASYNC221", "ASYNC240", "S603", "S607", "S110"]
"xagent/core/orchestration/langgraph_loop.py" = ["E501"]
"xagent/domains/creative_studio/canvas/__init__.py" = ["UP042"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
