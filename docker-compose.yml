# X-Agent 开发兼容入口（保留现有服务行为）
# R2/发布等价运行使用 deploy/compose/docker-compose.yml
# 一键启动：docker compose up -d
# 包含：API + Web + PostgreSQL + Redis + Qdrant + Prometheus + Grafana
#
# 多实例部署（≥2 个 api 副本）必读：docs/deployment/multi-instance.md
# - 必配 XAGENT_CACHE__REDIS_URL（登录限流共享计数 + 调度器分布式锁）
# - 必配 XAGENT_MEMORY__QDRANT_URL 指向 qdrant server（本地磁盘模式有独占文件锁）
# - SSE / WebSocket 长连接需要负载均衡器 sticky session
#
# 注意：应用实际读取的是 XAGENT_* 前缀环境变量（见 apps/api/xagent/infra/settings.py），
# 下方 api 服务已按 XAGENT_DB__URL / XAGENT_CACHE__REDIS_URL / XAGENT_MEMORY__QDRANT_URL 配置。

services:
  # ─── PostgreSQL ───
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: xagent
      POSTGRES_USER: xagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xagent_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xagent"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Redis ───
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Qdrant（向量库 server 模式；多实例必须，本地磁盘模式有独占文件锁）───
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"  # HTTP
      - "6334:6334"  # gRPC
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── X-Agent API ───
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      XAGENT_MODE: full
      XAGENT_DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://xagent:${POSTGRES_PASSWORD:-xagent_secret}@postgres:5432/xagent
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      # 应用实际读取的 XAGENT_* 变量（多实例必配，见 docs/deployment/multi-instance.md）
      XAGENT_MODE: full
      XAGENT_DB__URL: postgresql+asyncpg://xagent:${POSTGRES_PASSWORD:-xagent_secret}@postgres:5432/xagent
      XAGENT_CACHE__REDIS_URL: redis://redis:6379/0
      XAGENT_MEMORY__QDRANT_URL: http://qdrant:6333
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      FS_ALLOWED_ROOTS: /data/workspace
    volumes:
      - workspace:/data/workspace
      - skills:/app/data/skills
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  # ─── X-Agent Web ───
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

  # ─── Prometheus ───
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml
      - promdata:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  # ─── Grafana ───
  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafdata:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  workspace:
  skills:
  promdata:
  grafdata:
  qdrantdata:
