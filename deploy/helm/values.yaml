# X-Agent Helm values
# 用法: helm install xagent ./deploy/helm -f values.yaml

replicaCount: 2

image:
  repository: xagent-api
  tag: latest
  pullPolicy: IfNotPresent

api:
  port: 8000
  workers: 4
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits: { cpu: "2000m", memory: "4Gi" }

worker:
  enabled: true
  replicas: 2
  concurrency: 8

web:
  enabled: true
  port: 80

# 外部依赖（生产用 Bitnami Helm 或托管服务）
postgres:
  enabled: true
  url: ""  # 留空则用内置；生产建议外部
  database: xagent

redis:
  enabled: true
  url: ""

qdrant:
  enabled: true
  url: ""

# LLM 配置
llm:
  ollamaBaseUrl: ""
  ollamaModel: "qwen3:4b"
  proxyUrl: ""
  requestTimeoutSeconds: 150
  warmupEnabled: false
  warmupPrompt: "回复一个字：好"
  warmupMaxTokens: 8
  warmupWaitTimeoutSeconds: 30
  warmupPollIntervalSeconds: 1

# 安全
security:
  # 必填：每个部署环境提供独立的 32+ 字符随机值；模板会在缺失时 fail fast。
  jwtSecret: ""
  requireAuth: true

# 可观测
observability:
  langfuseHost: ""
  langfusePublicKey: ""
  langfuseSecretKey: ""
  prometheus: true

ingress:
  enabled: true
  className: nginx
  host: xagent.example.com
  tls: true

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
