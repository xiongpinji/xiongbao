# X-Agent Helm values
# 用法: helm install xagent ./deploy/helm -f values.yaml

replicaCount: 2

image:
  repository: xagent-api
  tag: latest
  pullPolicy: IfNotPresent

api:
  port: 8000
  workers: 4
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits: { cpu: "2000m", memory: "4Gi" }

worker:
  enabled: true
  replicas: 2
  concurrency: 8

web:
  enabled: true
  port: 80

# 外部依赖（生产用 Bitnami Helm 或托管服务）
postgres:
  enabled: true
  url: ""  # 留空则用内置；生产建议外部
  database: xagent

redis:
  enabled: true
  url: ""

qdrant:
  enabled: true
  url: ""

# LLM 配置
llm:
  ollamaBaseUrl: ""
  ollamaModel: "qwen3:4b"
  proxyUrl: ""
  proxyApiKey: ""
  existingProxyApiKeySecretRef:
    name: ""
    key: "proxy-api-key"
  requestTimeoutSeconds: 150
  warmupEnabled: false
  warmupPrompt: "回复一个字：好"
  warmupMaxTokens: 8
  warmupWaitTimeoutSeconds: 30
  warmupPollIntervalSeconds: 1

# 安全
security:
  # 两种注入方式二选一：
  # 1) 直接提供 jwtSecret（当前兼容模式）
  # 2) 提供 existingJwtSecretRef.name / key（平台化推荐）
  jwtSecret: ""
  existingJwtSecretRef:
    name: ""
    key: "jwt-secret"
  requireAuth: true

# 可观测
observability:
  langfuseHost: ""
  langfusePublicKey: ""
  langfuseSecretKey: ""
  existingLangfuseSecretRef:
    name: ""
    publicKeyKey: "langfuse-public-key"
    secretKeyKey: "langfuse-secret-key"
  prometheus: true

ingress:
  enabled: true
  className: nginx
  host: xagent.example.com
  tls: true

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
