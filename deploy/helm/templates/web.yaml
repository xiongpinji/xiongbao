{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "xagent.fullname" . }}-web
  namespace: {{ include "xagent.namespace" . }}
  labels:
    {{- include "xagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "xagent.webSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "xagent.webSelectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "xagent.serviceAccountName" . }}
      containers:
        - name: web
          image: {{ include "xagent.image" .Values.web.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "xagent.fullname" . }}-web
  namespace: {{ include "xagent.namespace" . }}
  labels:
    {{- include "xagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    {{- include "xagent.webSelectorLabels" . | nindent 4 }}
  ports: [{ port: {{ .Values.web.port }}, targetPort: 80 }]
{{- end }}
---
{{- if and .Values.web.enabled .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "xagent.fullname" . }}
  namespace: {{ include "xagent.namespace" . }}
  labels:
    {{- include "xagent.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.tls }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | default "letsencrypt-prod" }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ include "xagent.fullname" . }}-web, port: { number: {{ .Values.web.port }} } }
          {{- if .Values.api.enabled }}
          - path: /api
            pathType: Prefix
            backend:
              service: { name: {{ include "xagent.fullname" . }}-api, port: { number: {{ .Values.api.port }} } }
          {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts: [{{ .Values.ingress.host }}]
      secretName: {{ include "xagent.fullname" . }}-tls
  {{- end }}
{{- end }}
