{{- /*
Chart 管理的 Secret：仅承载 values 中显式提供的 secret（ESO 与 existingSecretRef 优先）。
注意：values.yaml 默认值不含真实 secret；请勿将真实 secret 提交进 values*.yaml。
生产推荐：secrets.eso.enabled=true（ESO）或 security.existingJwtSecretRef 等指向既有 Secret。
应用侧亦支持 SECRETREF:file:/env: 语法（见 docs/ENVIRONMENT_BASELINE_V1.md 第 8 章）。
*/ -}}
{{- if not .Values.secrets.eso.enabled }}
{{- $data := dict -}}
{{- if and .Values.security.jwtSecret (not .Values.security.existingJwtSecretRef.name) }}
{{- $_ := set $data "jwt-secret" .Values.security.jwtSecret -}}
{{- end }}
{{- if and .Values.llm.proxyApiKey (not .Values.llm.existingProxyApiKeySecretRef.name) }}
{{- $_ := set $data "proxy-api-key" .Values.llm.proxyApiKey -}}
{{- end }}
{{- if and (or .Values.observability.langfusePublicKey .Values.observability.langfuseSecretKey) (not .Values.observability.existingLangfuseSecretRef.name) }}
{{- $_ := set $data "langfuse-public-key" .Values.observability.langfusePublicKey -}}
{{- $_ := set $data "langfuse-secret-key" .Values.observability.langfuseSecretKey -}}
{{- end }}
{{- if and .Values.postgres.enabled (not .Values.postgres.url) (not .Values.postgres.existingSecretRef.name) .Values.postgres.password }}
{{- $_ := set $data "postgres-password" .Values.postgres.password -}}
{{- end }}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "xagent.secretName" . }}
  namespace: {{ include "xagent.namespace" . }}
  labels:
    {{- include "xagent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- end }}
