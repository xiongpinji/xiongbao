{{- if and .Values.redis.enabled (not .Values.redis.url) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "xagent.fullname" . }}-redis
  namespace: {{ include "xagent.namespace" . }}
  labels:
    {{- include "xagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ include "xagent.fullname" . }}-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "xagent.name" . }}-redis
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "xagent.name" . }}-redis
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          args: ["redis-server", "--appendonly", "yes"]
          ports: [{ containerPort: 6379 }]
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.redis.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "xagent.fullname" . }}-redis
  namespace: {{ include "xagent.namespace" . }}
  labels:
    {{- include "xagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  selector:
    app.kubernetes.io/name: {{ include "xagent.name" . }}-redis
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports: [{ port: 6379, targetPort: 6379 }]
{{- end }}
