{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels: { app: xagent-worker }
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: { app: xagent-worker }
  template:
    metadata:
      labels: { app: xagent-worker }
    spec:
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
            - { name: XAGENT_MODE, value: "enterprise" }
            - { name: XAGENT_DB__URL, value: "{{ .Values.postgres.url }}" }
            - { name: XAGENT_CACHE__REDIS_URL, value: "{{ .Values.redis.url }}" }
            - { name: XAGENT_MEMORY__QDRANT_URL, value: "{{ .Values.qdrant.url }}" }
            - { name: XAGENT_LLM__OLLAMA_BASE_URL, value: "{{ .Values.llm.ollamaBaseUrl }}" }
            - { name: XAGENT_LLM__OLLAMA_MODEL, value: "{{ .Values.llm.ollamaModel }}" }
            - { name: XAGENT_LLM__REQUEST_TIMEOUT_SECONDS, value: {{ .Values.llm.requestTimeoutSeconds | quote }} }
            - { name: XAGENT_LLM__WARMUP_ENABLED, value: {{ .Values.llm.warmupEnabled | quote }} }
            - { name: XAGENT_LLM__WARMUP_PROMPT, value: {{ .Values.llm.warmupPrompt | quote }} }
            - { name: XAGENT_LLM__WARMUP_MAX_TOKENS, value: {{ .Values.llm.warmupMaxTokens | quote }} }
            - { name: XAGENT_LLM__WARMUP_WAIT_TIMEOUT_SECONDS, value: {{ .Values.llm.warmupWaitTimeoutSeconds | quote }} }
            - { name: XAGENT_LLM__WARMUP_POLL_INTERVAL_SECONDS, value: {{ .Values.llm.warmupPollIntervalSeconds | quote }} }
            {{- if .Values.observability.existingLangfuseSecretRef.name }}
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.observability.existingLangfuseSecretRef.name | quote }}
                  key: {{ .Values.observability.existingLangfuseSecretRef.publicKeyKey | quote }}
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.observability.existingLangfuseSecretRef.name | quote }}
                  key: {{ .Values.observability.existingLangfuseSecretRef.secretKeyKey | quote }}
            {{- else }}
            - name: LANGFUSE_PUBLIC_KEY
              value: {{ .Values.observability.langfusePublicKey | quote }}
            - name: LANGFUSE_SECRET_KEY
              value: {{ .Values.observability.langfuseSecretKey | quote }}
            {{- end }}
            {{- if .Values.security.existingJwtSecretRef.name }}
            - name: XAGENT_SECURITY__JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.security.existingJwtSecretRef.name | quote }}
                  key: {{ .Values.security.existingJwtSecretRef.key | quote }}
            {{- else }}
            - name: XAGENT_SECURITY__JWT_SECRET
              value: {{ required "either security.jwtSecret or security.existingJwtSecretRef.name is required" .Values.security.jwtSecret | quote }}
            {{- end }}
          command: ["sh", "-c"]
          args:
            - "(python -m xagent.cli warmup || true) && exec celery -A xagent.worker.celery_app worker --loglevel=info --concurrency {{ .Values.worker.concurrency }}"
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1000m", memory: "2Gi" }
{{- end }}
---
{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels: { app: xagent-web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: xagent-web }
  template:
    metadata:
      labels: { app: xagent-web }
    spec:
      containers:
        - name: web
          image: "xagent-web:{{ .Values.image.tag }}"
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
spec:
  selector: { app: xagent-web }
  ports: [{ port: 80, targetPort: 80 }]
{{- end }}
---
{{- if .Values.observability.prometheus }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: xagent-api
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
{{- end }}
