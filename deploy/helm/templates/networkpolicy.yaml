{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "xagent.fullname" . }}-default-deny
  namespace: {{ include "xagent.namespace" . }}
  labels:
    {{- include "xagent.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "xagent.fullname" . }}-allow-ingress
  namespace: {{ include "xagent.namespace" . }}
  labels:
    {{- include "xagent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "xagent.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- if .Values.networkPolicy.allowFromIngressController }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        {{- end }}
        {{- if .Values.networkPolicy.allowFromMonitoring }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        {{- end }}
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
        {{- if .Values.web.enabled }}
        - protocol: TCP
          port: {{ .Values.web.port }}
        {{- end }}
{{- end }}
