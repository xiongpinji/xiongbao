{{- if .Values.secrets.eso.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "xagent.fullname" . }}-eso
  namespace: {{ include "xagent.namespace" . }}
  labels:
    {{- include "xagent.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.eso.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.eso.secretStoreName | default (printf "%s-%s" (include "xagent.fullname" .) .Values.secrets.eso.backend) }}
    kind: {{ .Values.secrets.eso.secretStoreKind }}
  target:
    name: {{ include "xagent.fullname" . }}-eso
    creationPolicy: Owner
  data:
    - secretKey: jwt-secret
      remoteRef:
        key: {{ .Values.secrets.eso.vault.path | default .Values.secrets.eso.aws.secretName | default .Values.secrets.eso.gcp.secretName | default "xagent" }}
        property: jwt-secret
    - secretKey: proxy-api-key
      remoteRef:
        key: {{ .Values.secrets.eso.vault.path | default .Values.secrets.eso.aws.secretName | default .Values.secrets.eso.gcp.secretName | default "xagent" }}
        property: proxy-api-key
    - secretKey: langfuse-public-key
      remoteRef:
        key: {{ .Values.secrets.eso.vault.path | default .Values.secrets.eso.aws.secretName | default .Values.secrets.eso.gcp.secretName | default "xagent" }}
        property: langfuse-public-key
    - secretKey: langfuse-secret-key
      remoteRef:
        key: {{ .Values.secrets.eso.vault.path | default .Values.secrets.eso.aws.secretName | default .Values.secrets.eso.gcp.secretName | default "xagent" }}
        property: langfuse-secret-key
    - secretKey: db-password
      remoteRef:
        key: {{ .Values.secrets.eso.vault.path | default .Values.secrets.eso.aws.secretName | default .Values.secrets.eso.gcp.secretName | default "xagent" }}
        property: db-password
{{- end }}
