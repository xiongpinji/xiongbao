{{- if and .Values.postgres.enabled (not .Values.postgres.url) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "xagent.fullname" . }}-postgres
  namespace: {{ include "xagent.namespace" . }}
  labels:
    {{- include "xagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "xagent.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "xagent.name" . }}-postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "xagent.name" . }}-postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }} }
            - { name: POSTGRES_USER, value: "xagent" }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- include "xagent.postgresPasswordSecretRef" . | nindent 18 }}
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1000m", memory: "1Gi" }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "xagent", "-d", {{ .Values.postgres.database | quote }}] }
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "xagent.fullname" . }}-postgres
  namespace: {{ include "xagent.namespace" . }}
  labels:
    {{- include "xagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  selector:
    app.kubernetes.io/name: {{ include "xagent.name" . }}-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports: [{ port: 5432, targetPort: 5432 }]
{{- end }}
