{{- if and .Values.qdrant.enabled (not .Values.qdrant.url) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "xagent.fullname" . }}-qdrant
  namespace: {{ include "xagent.namespace" . }}
  labels:
    {{- include "xagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: qdrant
spec:
  serviceName: {{ include "xagent.fullname" . }}-qdrant
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "xagent.name" . }}-qdrant
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "xagent.name" . }}-qdrant
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: qdrant
          image: {{ .Values.qdrant.image | quote }}
          ports: [{ containerPort: 6333 }, { containerPort: 6334 }]
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1000m", memory: "2Gi" }
          volumeMounts:
            - { name: data, mountPath: /qdrant/storage }
          readinessProbe:
            httpGet: { path: /readyz, port: 6333 }
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.qdrant.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "xagent.fullname" . }}-qdrant
  namespace: {{ include "xagent.namespace" . }}
  labels:
    {{- include "xagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: qdrant
spec:
  selector:
    app.kubernetes.io/name: {{ include "xagent.name" . }}-qdrant
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - { name: http, port: 6333, targetPort: 6333 }
    - { name: grpc, port: 6334, targetPort: 6334 }
{{- end }}
