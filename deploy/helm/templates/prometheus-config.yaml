{{- if .Values.observability.prometheus }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "xagent.fullname" . }}-prometheus-config
  namespace: {{ include "xagent.namespace" . }}
  labels:
    {{- include "xagent.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: xagent-api
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
{{- end }}
