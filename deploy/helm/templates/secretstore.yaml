{{- if .Values.secrets.eso.enabled }}
{{- if eq .Values.secrets.eso.backend "vault" }}
apiVersion: external-secrets.io/v1beta1
kind: {{ .Values.secrets.eso.secretStoreKind }}
metadata:
  name: {{ .Values.secrets.eso.secretStoreName | default (printf "%s-vault" (include "xagent.fullname" .)) }}
  namespace: {{ include "xagent.namespace" . }}
  labels:
    {{- include "xagent.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ .Values.secrets.eso.vault.server | quote }}
      path: {{ .Values.secrets.eso.vault.path | quote }}
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: {{ .Values.secrets.eso.vault.role | quote }}
          serviceAccountRef:
            name: {{ include "xagent.serviceAccountName" . }}
{{- else if eq .Values.secrets.eso.backend "aws" }}
apiVersion: external-secrets.io/v1beta1
kind: {{ .Values.secrets.eso.secretStoreKind }}
metadata:
  name: {{ .Values.secrets.eso.secretStoreName | default (printf "%s-aws" (include "xagent.fullname" .)) }}
  namespace: {{ include "xagent.namespace" . }}
  labels:
    {{- include "xagent.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.secrets.eso.aws.region | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ include "xagent.serviceAccountName" . }}
{{- else if eq .Values.secrets.eso.backend "gcp" }}
apiVersion: external-secrets.io/v1beta1
kind: {{ .Values.secrets.eso.secretStoreKind }}
metadata:
  name: {{ .Values.secrets.eso.secretStoreName | default (printf "%s-gcp" (include "xagent.fullname" .)) }}
  namespace: {{ include "xagent.namespace" . }}
  labels:
    {{- include "xagent.labels" . | nindent 4 }}
spec:
  provider:
    gcpsm:
      projectID: {{ .Values.secrets.eso.gcp.projectId | quote }}
      auth:
        workloadIdentity:
          clusterLocation: ""
          clusterName: ""
          serviceAccountRef:
            name: {{ include "xagent.serviceAccountName" . }}
{{- else if eq .Values.secrets.eso.backend "azure" }}
apiVersion: external-secrets.io/v1beta1
kind: {{ .Values.secrets.eso.secretStoreKind }}
metadata:
  name: {{ .Values.secrets.eso.secretStoreName | default (printf "%s-azure" (include "xagent.fullname" .)) }}
  namespace: {{ include "xagent.namespace" . }}
  labels:
    {{- include "xagent.labels" . | nindent 4 }}
spec:
  provider:
    azurekv:
      vaultUrl: {{ .Values.secrets.eso.azure.vaultUrl | quote }}
      authType: WorkloadIdentity
      serviceAccountRef:
        name: {{ include "xagent.serviceAccountName" . }}
{{- end }}
{{- end }}
