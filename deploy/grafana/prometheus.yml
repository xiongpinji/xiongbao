# X-Agent Prometheus 配置
# 挂载到 Prometheus 容器: /etc/prometheus/prometheus.yml

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: xagent
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: xagent-api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
