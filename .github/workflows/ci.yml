name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check xagent tests

      - name: Type check (mypy)
        run: mypy xagent --ignore-missing-imports || true  # 逐步收紧

      - name: Test (pytest)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  license-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime deps
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: License gate (拦截 AGPL/GPL/ELv2/SSPL)
        run: python scripts/license_check.py

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:latest
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promptfoo-eval:
    runs-on: ubuntu-latest
    needs: [backend, license-gate]
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.XAGENT_LLM__OPENAI_API_KEY }}
      XAGENT_LLM__OPENAI_API_KEY: ${{ secrets.XAGENT_LLM__OPENAI_API_KEY || secrets.OPENAI_API_KEY }}
      XAGENT_LLM__DEFAULT_MODEL: gpt-4o-mini
      XAGENT_MODE: lite
      XAGENT_SECURITY__REQUIRE_AUTH: "false"
      XAGENT_DB__URL: sqlite+aiosqlite:///./xagent-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install API deps
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run migrations
        working-directory: apps/api
        run: python -m alembic upgrade head
      - name: Start API
        working-directory: apps/api
        run: |
          nohup xagent serve --host 0.0.0.0 --port 8000 >/tmp/xagent.log 2>&1 &
          echo $! >/tmp/xagent.pid
      - name: Wait for API readiness
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/ready; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready" >&2
          cat /tmp/xagent.log >&2 || true
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install promptfoo
        run: npm install -g promptfoo
      - name: Run eval
        run: promptfoo eval -c .promptfoo/config.yaml --no-cache
