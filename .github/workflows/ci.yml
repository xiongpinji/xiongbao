name: CI

on:
  push:
    branches: [main, master, develop, "candidate/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Critical lint gate
        run: ruff check xagent tests --select F821,F822,F823,B023

      - name: Static quality baseline
        run: python ../../scripts/check_static_quality.py

      - name: Test (Web/API release scope)
        run: python ../../scripts/run_webapi_release_tests.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Production dependency audit
        run: npm run audit:release

      - name: Lint
        run: npm run lint

      - name: Exact lint exemption gate
        run: npm run lint:release

      - name: Unit test
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  license-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime deps
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: License gate (拦截 AGPL/GPL/ELv2/SSPL)
        run: python scripts/license_check.py

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit locked Python dependencies
        run: |
          python -m pip install pip-audit==2.10.0
          pip-audit -r apps/api/requirements.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/sdk-ts/package-lock.json

      - name: Audit locked Node production dependencies
        run: |
          npm --prefix apps/web audit --omit=dev --audit-level=high
          npm --prefix packages/sdk-ts audit --omit=dev --audit-level=high

      - uses: dtolnay/rust-toolchain@stable

      - name: Audit locked Rust dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file apps/desktop/Cargo.lock

      - name: Build API image for SBOM
        run: docker build -t xagent-api:ci-sbom apps/api

      - name: Build web assets and image for SBOM
        run: |
          npm --prefix apps/web ci
          npm --prefix apps/web run build
          docker build -t xagent-web:ci-sbom apps/web

      - name: Generate API SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: xagent-api:ci-sbom
          format: spdx-json
          output-file: sbom-api.spdx.json
          upload-artifact: false

      - name: Generate web SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: xagent-web:ci-sbom
          format: spdx-json
          output-file: sbom-web.spdx.json
          upload-artifact: false

      - name: Upload commercial SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: commercial-sboms
          path: sbom-*.spdx.json
          if-no-files-found: error

  config-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate Helm values (all envs)
        run: |
          for env in dev staging prod enterprise; do
            python scripts/validate_helm_values.py --env "$env"
          done

      - name: Helm template render gate (base + 4 overlays)
        run: |
          helm template xagent ./deploy/helm > /dev/null
          for env in dev staging prod enterprise; do
            helm template xagent ./deploy/helm -f deploy/helm/environments/values-$env.yaml > /dev/null
          done

      - name: Env diff smoke
        run: python scripts/render_env_diff.py --from dev --to prod --format json > /dev/null

      - name: R2 compose contract
        run: python -m unittest discover -s tests/release -p "test_r2_*.py" -v

      - name: R3 load contract
        run: python -m unittest discover -s tests/release -p "test_r3_load_contract.py" -v

      - name: R3 Promptfoo contract
        run: python -m unittest discover -s tests/release -p "test_r3_promptfoo_contract.py" -v

      - name: R2 compose render
        env:
          POSTGRES_PASSWORD: config-only-postgres-strong-value
          XAGENT_SECURITY__JWT_SECRET: config-only-jwt-secret-at-least-32-characters
          GRAFANA_ADMIN_PASSWORD: config-only-grafana-strong-value
        run: docker compose -f deploy/compose/docker-compose.yml --env-file deploy/compose/r2.env.example config --quiet

  docker-build:
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - license-gate
      - supply-chain
      - config-governance
      - e2e-api
      - load-test
      - promptfoo-eval
      - release-version
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API image metadata
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=raw,value=latest
            type=sha
            type=semver,pattern={{version}}

      - name: Build & Push API image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web dist（web Dockerfile 依赖宿主机预构建 dist/）
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: npm ci & build
        working-directory: apps/web
        run: |
          npm ci
          npm run build

      - name: Web image metadata
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=raw,value=latest
            type=sha
            type=semver,pattern={{version}}

      - name: Build & Push Web image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e-api:
    runs-on: ubuntu-latest
    needs: [backend]
    # 即使 backend 失败也运行（cancelled 除外）：api-smoke 是独立起服务的 API 冒烟，
    # 不依赖 backend 产物；needs 只用于排序。2026-08 教训：backend 红时 e2e-api 被
    # 连带 SKIPPED，导致 API 口径漂移（403 语义/模板路由//perf 坏端点）被掩盖。
    if: ${{ always() && needs.backend.result != 'cancelled' }}
    env:
      XAGENT_MODE: lite
      XAGENT_SECURITY__REQUIRE_AUTH: "false"
      XAGENT_DB__URL: sqlite+aiosqlite:///./xagent-e2e.db
      E2E_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Start API
        working-directory: apps/api
        run: |
          nohup uvicorn xagent.main:app --host 0.0.0.0 --port 8000 >/tmp/xagent-e2e.log 2>&1 &
          echo $! >/tmp/xagent-e2e.pid

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          echo "API not ready" >&2; cat /tmp/xagent-e2e.log >&2; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run API E2E tests
        working-directory: tests/e2e
        run: npx playwright test specs/api-smoke.spec.ts --reporter=list

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: tests/e2e/playwright-report/
          retention-days: 7

  load-test:
    runs-on: ubuntu-latest
    needs: [backend]
    if: github.event_name == 'push'
    env:
      XAGENT_MODE: lite
      XAGENT_SECURITY__REQUIRE_AUTH: "false"
      XAGENT_SECURITY__RATE_LIMIT_ENABLED: "false"
      XAGENT_DB__URL: sqlite+aiosqlite:///./xagent-load.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Start API
        working-directory: apps/api
        run: |
          nohup uvicorn xagent.main:app --host 0.0.0.0 --port 8000 >/tmp/xagent-load.log 2>&1 &

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 load test
        run: k6 run --env BASE_URL=http://127.0.0.1:8000 tests/load/k6-load.js

  promptfoo-eval:
    runs-on: ubuntu-latest
    needs: [backend, license-gate]
    if: github.event_name == 'push'
    env:
      XAGENT_MODE: lite
      XAGENT_SECURITY__REQUIRE_AUTH: "true"
      XAGENT_DB__URL: sqlite+aiosqlite:///./xagent-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Configure CI JWT secret
        run: |
          python - <<'PY'
          import os
          import secrets

          secret = secrets.token_urlsafe(48)
          print(f"::add-mask::{secret}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"XAGENT_SECURITY__JWT_SECRET={secret}\n")
          PY
      - name: Install API deps
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run migrations
        working-directory: apps/api
        run: python -m alembic upgrade head
      - name: Start API
        working-directory: apps/api
        run: |
          nohup uvicorn xagent.main:app --host 0.0.0.0 --port 8000 >/tmp/xagent.log 2>&1 &
          echo $! >/tmp/xagent.pid
      - name: Wait for API readiness
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/ready; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready" >&2
          cat /tmp/xagent.log >&2 || true
          exit 1
      - name: Create Promptfoo member token
        run: |
          python - <<'PY'
          import json
          import os
          import secrets
          import urllib.error
          import urllib.request

          identity = f"promptfoo-ci-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          payload = json.dumps({
              "username": identity,
              "password": secrets.token_urlsafe(32),
              "tenant_id": identity,
          }).encode("utf-8")
          request = urllib.request.Request(
              "http://127.0.0.1:8000/api/v1/auth/register",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  body = json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"Promptfoo CI registration failed: HTTP {exc.code}") from None

          token = str(body.get("access_token") or "")
          if body.get("tenant_id") != identity or "member" not in body.get("roles", []) or not token:
              raise SystemExit("Promptfoo CI registration returned an invalid member identity")
          print(f"::add-mask::{token}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"PROMPTFOO_API_TOKEN={token}\n")
              env_file.write(f"PROMPTFOO_TENANT_ID={identity}\n")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install promptfoo
        run: npm install -g promptfoo@0.122.0
      - name: Run eval
        run: |
          promptfoo eval -c .promptfoo/config.yaml --no-cache --max-concurrency 1 \
            --output /tmp/promptfoo-results.json
          python scripts/check_promptfoo_results.py \
            /tmp/promptfoo-results.json --expected 8

  release-version:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install release contract dependencies
        run: python -m pip install pytest==9.1.1 PyYAML==6.0.3

      - name: Test release and container contracts
        run: >-
          python -m pytest
          tests/release/test_release_version_gate.py
          tests/release/test_container_contract.py
          tests/release/test_helm_image_contract.py
          tests/release/test_compose_image_contract.py -q

      - name: Verify release versions
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            python scripts/verify_release_versions.py --tag "${GITHUB_REF_NAME}"
          else
            python scripts/verify_release_versions.py
          fi

      - name: Release tag immutability sentinel
        run: python scripts/verify_release_tags.py

  release:
    needs:
      - backend
      - frontend
      - license-gate
      - config-governance
      - docker-build
      - e2e-api
      - load-test
      - promptfoo-eval
      - release-version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
