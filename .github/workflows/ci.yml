name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        # 现状 309 项（多为 E501 行宽），先报告不拦截，与 mypy 一致逐步收紧；
        # 已删除的 xagent/api/ 顶层死模块不复存在，无需额外排除。
        run: ruff check xagent tests --statistics || true  # 逐步收紧

      - name: Type check (mypy)
        run: mypy xagent --ignore-missing-imports || true  # 逐步收紧

      - name: Test (pytest)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  license-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime deps
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: License gate (拦截 AGPL/GPL/ELv2/SSPL)
        run: python scripts/license_check.py

  config-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate Helm values (all envs)
        run: |
          for env in dev staging prod enterprise; do
            python scripts/validate_helm_values.py --env "$env"
          done

      - name: Helm template render gate (base + 4 overlays)
        run: |
          helm template xagent ./deploy/helm > /dev/null
          for env in dev staging prod enterprise; do
            helm template xagent ./deploy/helm -f deploy/helm/environments/values-$env.yaml > /dev/null
          done

      - name: Env diff smoke
        run: python scripts/render_env_diff.py --from dev --to prod --format json > /dev/null

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:latest
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e-api:
    runs-on: ubuntu-latest
    needs: [backend]
    # 即使 backend 失败也运行（cancelled 除外）：api-smoke 是独立起服务的 API 冒烟，
    # 不依赖 backend 产物；needs 只用于排序。2026-08 教训：backend 红时 e2e-api 被
    # 连带 SKIPPED，导致 API 口径漂移（403 语义/模板路由//perf 坏端点）被掩盖。
    if: ${{ always() && needs.backend.result != 'cancelled' }}
    env:
      XAGENT_MODE: lite
      XAGENT_SECURITY__REQUIRE_AUTH: "false"
      XAGENT_DB__URL: sqlite+aiosqlite:///./xagent-e2e.db
      E2E_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Start API
        working-directory: apps/api
        run: |
          nohup uvicorn xagent.main:app --host 0.0.0.0 --port 8000 >/tmp/xagent-e2e.log 2>&1 &
          echo $! >/tmp/xagent-e2e.pid

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          echo "API not ready" >&2; cat /tmp/xagent-e2e.log >&2; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run API E2E tests
        working-directory: tests/e2e
        run: npx playwright test specs/api-smoke.spec.ts --reporter=list

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: tests/e2e/playwright-report/
          retention-days: 7

  load-test:
    runs-on: ubuntu-latest
    needs: [backend]
    if: github.event_name == 'push'
    env:
      XAGENT_MODE: lite
      XAGENT_SECURITY__REQUIRE_AUTH: "false"
      XAGENT_DB__URL: sqlite+aiosqlite:///./xagent-load.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Start API
        working-directory: apps/api
        run: |
          nohup uvicorn xagent.main:app --host 0.0.0.0 --port 8000 >/tmp/xagent-load.log 2>&1 &

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D68
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install k6

      - name: Run k6 load test
        run: k6 run --env BASE_URL=http://127.0.0.1:8000 tests/load/k6-load.js

  promptfoo-eval:
    runs-on: ubuntu-latest
    needs: [backend, license-gate]
    if: github.event_name == 'push'
    env:
      XAGENT_MODE: lite
      XAGENT_SECURITY__REQUIRE_AUTH: "false"
      XAGENT_DB__URL: sqlite+aiosqlite:///./xagent-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install API deps
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run migrations
        working-directory: apps/api
        run: python -m alembic upgrade head
      - name: Start API
        working-directory: apps/api
        run: |
          nohup xagent serve --host 0.0.0.0 --port 8000 >/tmp/xagent.log 2>&1 &
          echo $! >/tmp/xagent.pid
      - name: Wait for API readiness
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/ready; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready" >&2
          cat /tmp/xagent.log >&2 || true
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install promptfoo
        run: npm install -g promptfoo
      - name: Run eval
        run: promptfoo eval -c .promptfoo/config.yaml --no-cache
